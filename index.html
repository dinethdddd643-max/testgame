<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charging Detector</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 40px;
        flex-direction: column;
        gap: 30px;
    }
    #status {
        padding: 20px 40px;
        border: 2px solid white;
        border-radius: 12px;
    }
    #unlock-btn {
        font-size: 20px;
        padding: 12px 28px;
        border: 2px solid #888;
        border-radius: 10px;
        background: transparent;
        color: #aaa;
        cursor: pointer;
    }
    #unlock-btn.unlocked {
        border-color: #4caf50;
        color: #4caf50;
    }
</style>
</head>
<body>
<div id="status"></div>
<button id="unlock-btn">Tap to enable sounds</button>

<script>
const plugSound  = new Audio("plug.mp3");
const unplugSound = new Audio("unplug.mp3");
const plug2Sound  = new Audio("plug2.mp3");
const plug3Sound  = new Audio("plug3.mp3");

let soundTimer   = null; // 2-second delay for plug/unplug sounds
let warningTimer = null; // 10-second countdown after unplugging

// --- Rapid switching detection ---
let switchTimestamps = []; // stores the time of each recent switch
let isFrantic        = false; // true while plug3.mp3 is playing

let audioUnlocked = false;

document.getElementById("unlock-btn").addEventListener("click", () => {
    [plugSound, unplugSound, plug2Sound, plug3Sound].forEach(s => {
        s.volume = 0;
        s.play().then(() => s.pause());
        s.volume = 1;
        s.currentTime = 0;
    });

    audioUnlocked = true;

    const btn = document.getElementById("unlock-btn");
    btn.textContent = "✓ Sounds enabled";
    btn.classList.add("unlocked");
    btn.disabled = true;
});

function playSound(sound) {
    if (!audioUnlocked) return;
    sound.currentTime = 0;
    sound.play();
}

function stopSound(sound) {
    sound.pause();
    sound.currentTime = 0;
}

function checkFrantic() {
    const now = Date.now(); // current time in milliseconds

    // Add this switch moment to the log
    switchTimestamps.push(now);

    // Throw away any timestamps older than 1 second
    // so we're only ever looking at switches in the last 1000ms
    switchTimestamps = switchTimestamps.filter(t => now - t <= 1000);

    // If 5 or more switches happened within that 1-second window → frantic!
    if (switchTimestamps.length >= 5 && !isFrantic) {
        isFrantic = true;

        // Cancel normal sounds — don't want plug/unplug/warning playing over this
        clearTimeout(soundTimer);
        clearTimeout(warningTimer);
        stopSound(plugSound);
        stopSound(unplugSound);

        // Loop plug3.mp3 continuously while frantic
        plug3Sound.loop = true;
        playSound(plug3Sound);
    }
}

async function checkBattery() {
    if (!navigator.getBattery) {
        document.getElementById("status").innerText = "Not Supported";
        return;
    }

    const battery = await navigator.getBattery();
    const status = document.getElementById("status");

    function updateStatus() {
        // Record this switch for frantic detection
        checkFrantic();

        // Always cancel pending sound delay
        clearTimeout(soundTimer);

        if (battery.charging) {
            status.innerText = "Charging";

            // Cancel the 10-second warning — user plugged back in
            clearTimeout(warningTimer);
            warningTimer = null;

            // If frantic mode is active and charger is now stably plugged in, stop it
            if (isFrantic) {
                isFrantic = false;
                switchTimestamps = []; // reset the switch log
                stopSound(plug3Sound);
            }

            // Play plug sound after 2 seconds (only if not frantic)
            soundTimer = setTimeout(() => {
                if (!isFrantic) playSound(plugSound);
            }, 2000);

        } else {
            status.innerText = "";

            // Don't start warning or unplug sound while frantic
            if (!isFrantic) {
                soundTimer = setTimeout(() => playSound(unplugSound), 2000);

                warningTimer = setTimeout(() => {
                    playSound(plug2Sound);
                    warningTimer = null;
                }, 10000);
            }
        }
    }

    battery.addEventListener("chargingchange", updateStatus);
    updateStatus();
}

checkBattery();
</script>
</body>
</html>
