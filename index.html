<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charging Detector</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 40px;
        flex-direction: column;
        gap: 30px;
    }
    #status {
        padding: 20px 40px;
        border: 2px solid white;
        border-radius: 12px;
    }
    #unlock-btn {
        font-size: 20px;
        padding: 12px 28px;
        border: 2px solid #888;
        border-radius: 10px;
        background: transparent;
        color: #aaa;
        cursor: pointer;
    }
    #unlock-btn.unlocked {
        border-color: #4caf50;
        color: #4caf50;
    }
</style>
</head>
<body>
<div id="status"></div>
<button id="unlock-btn">Tap to enable sounds</button>

<script>
const plugSound   = new Audio("plug.mp3");
const unplugSound = new Audio("unplug.mp3");
const plug2Sound  = new Audio("plug2.mp3");
const plug3Sound  = new Audio("plug3.mp3");

let soundTimer   = null;
let warningTimer = null;

let switchTimestamps = [];
let isFrantic        = false;
let franticHappened  = false; // once plug3 plays, this becomes true forever

let audioUnlocked = false;

document.getElementById("unlock-btn").addEventListener("click", () => {
    [plugSound, unplugSound, plug2Sound, plug3Sound].forEach(s => {
        s.volume = 0;
        s.play().then(() => s.pause());
        s.volume = 1;
        s.currentTime = 0;
    });

    audioUnlocked = true;

    const btn = document.getElementById("unlock-btn");
    btn.textContent = "✓ Sounds enabled";
    btn.classList.add("unlocked");
    btn.disabled = true;
});

function playSound(sound) {
    if (!audioUnlocked) return;
    if (franticHappened) return; // silence everything after plug3 has played
    sound.currentTime = 0;
    sound.play();
}

function stopSound(sound) {
    sound.pause();
    sound.currentTime = 0;
}

function checkFrantic() {
    const now = Date.now();
    switchTimestamps.push(now);
    switchTimestamps = switchTimestamps.filter(t => now - t <= 15000);

    if (switchTimestamps.length >= 5 && !isFrantic) {
        isFrantic = true;
        franticHappened = true; // set permanently — no sounds after this

        clearTimeout(soundTimer);
        clearTimeout(warningTimer);
        stopSound(plugSound);
        stopSound(unplugSound);

        plug3Sound.loop = true;
        plug3Sound.currentTime = 0;
        plug3Sound.play();
    }
}

async function checkBattery() {
    if (!navigator.getBattery) {
        document.getElementById("status").innerText = "Not Supported";
        return;
    }

    const battery = await navigator.getBattery();
    const status = document.getElementById("status");

    function updateStatus() {
        checkFrantic();
        clearTimeout(soundTimer);

        if (battery.charging) {
            status.innerText = "Charging";
            clearTimeout(warningTimer);
            warningTimer = null;

            if (isFrantic) {
                isFrantic = false;
                switchTimestamps = [];
                stopSound(plug3Sound);
                // franticHappened stays true — no more sounds ever
            }

            soundTimer = setTimeout(() => {
                if (!isFrantic) playSound(plugSound);
            }, 2000);

        } else {
            status.innerText = "";

            if (!isFrantic) {
                soundTimer = setTimeout(() => playSound(unplugSound), 2000);

                warningTimer = setTimeout(() => {
                    playSound(plug2Sound);
                    warningTimer = null;
                }, 10000);
            }
        }
    }

    battery.addEventListener("chargingchange", updateStatus);
    updateStatus();
}

checkBattery();
</script>
</body>
</html>
