<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charging Detector</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 40px;
        flex-direction: column;
        gap: 30px;
    }
    #status {
        padding: 20px 40px;
        border: 2px solid white;
        border-radius: 12px;
    }
    #unlock-btn {
        font-size: 20px;
        padding: 12px 28px;
        border: 2px solid #888;
        border-radius: 10px;
        background: transparent;
        color: #aaa;
        cursor: pointer;
    }
    #unlock-btn.unlocked {
        border-color: #4caf50;
        color: #4caf50;
    }
</style>
</head>
<body>
<div id="status"></div>
<button id="unlock-btn">Tap to enable sounds</button>

<script>
const plugSound = new Audio("plug1.mp3");
const unplugSound = new Audio("unplug1.mp3");

let soundTimer = null;
let audioUnlocked = false;

document.getElementById("unlock-btn").addEventListener("click", () => {
    plugSound.volume = 0;
    unplugSound.volume = 0;

    plugSound.play().then(() => plugSound.pause());
    unplugSound.play().then(() => unplugSound.pause());

    // Restore normal volume after unlocking
    plugSound.volume = 1;
    unplugSound.volume = 1;
    plugSound.currentTime = 0;
    unplugSound.currentTime = 0;

    audioUnlocked = true;

    const btn = document.getElementById("unlock-btn");
    btn.textContent = "✓ Sounds enabled";
    btn.classList.add("unlocked");
    btn.disabled = true;
});

async function checkBattery() {
    if (!navigator.getBattery) {
        document.getElementById("status").innerText = "Not Supported";
        return;
    }

    const battery = await navigator.getBattery();
    const status = document.getElementById("status");

    function updateStatus() {
        clearTimeout(soundTimer);

        if (battery.charging) {
            status.innerText = "Charging";
            soundTimer = setTimeout(() => {
                if (audioUnlocked) {
                    plugSound.currentTime = 0;
                    plugSound.play();
                }
            }, 2000);
        } else {
            status.innerText = "";
            soundTimer = setTimeout(() => {
                if (audioUnlocked) {
                    unplugSound.currentTime = 0;
                    unplugSound.play();
                }
            }, 2000);
        }
    }

    battery.addEventListener("chargingchange", updateStatus);
    updateStatus();
}

checkBattery();
</script>
</body>
</html>
